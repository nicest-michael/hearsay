[package]
name = "hearsay-engine"
description = "Hearsay runtime: the conversation loop (STT -> LLM -> TTS -> playback) with barge-in, command/event types — shared by any UI shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hearsay-core.workspace = true
crossbeam-channel = "0.5"
log.workspace = true

[dev-dependencies]
# Only the e2e example wires concrete adapters; the engine library orchestrates purely
# through core ports (kept out of [dependencies] so the app layer can't couple to them).
hearsay-adapters.workspace = true
hound = "3.5.1"
env_logger = "0.11"

[lints.rust]
unsafe_code = "forbid"
