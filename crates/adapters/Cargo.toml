[package]
name = "hearsay-adapters"
description = "Hearsay driven adapters: cpal (mic + playback), whisper-rs (Metal STT), Kokoro TTS sidecar, mlx LLM, resampler, sidecar lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
hearsay-core.workspace = true
log.workspace = true
thiserror.workspace = true
cpal = "0.17.3"
crossbeam-channel = "0.5.15"
libc = "0.2"
# Direct access to the VoiceProcessingIO AudioUnit (hardware AEC) — coreaudio-rs is
# already in the tree transitively via cpal, so this pins the same version.
coreaudio-rs = { version = "0.14", features = ["audio_unit"] }
objc2-audio-toolbox = "0.3"
hound = "3.5.1"
rtrb = "0.3.4"
ureq = { version = "3.3.0", features = ["json"] }
whisper-rs = { version = "0.16.0", features = ["metal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "allow"
